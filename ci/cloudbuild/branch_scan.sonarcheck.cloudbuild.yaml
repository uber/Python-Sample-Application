steps:
- name: 'gcr.io/cloud-builders/docker:24.0.9'
  id: Base
  script: |
    #!/usr/bin/env bash

    docker build \
      -t us-central1-docker.pkg.dev/lab-test-project-1-305710/pkr-test/uber-example:1 \
      .

- name: 'gcr.io/cloud-builders/git:latest'
  id: Git Clone
  wait_for: ['Base']
  entrypoint: 'bash'
  secretEnv: ["GITHUB_TOKEN"]
  args:
    - -c
    - |
      set -o errexit   # exit on error
      set -o nounset   # fail if var undefined
      set -o noclobber # don't overwrite exists files via >
      set -o pipefail  # fails if pipes (|) fails

      git clone \
          -b sonar-scan \
          --recurse-submodules \
         http://oauth2:$$GITHUB_TOKEN@github.com/pkr-test/Python-Sample-Application.git \
          /workspace/tmp/Python-Sample-Application

- name: "sonarsource/sonar-scanner-cli"
  secretEnv:
    - SONAR_TOKEN
  entrypoint: "bash"
  args:
    - -c
    - |
      set -e
      sonar-scanner \
        -Dsonar.working.directory=/tmp/.scannerwork \
        -Dsonar.login=$$SONAR_TOKEN \
        -Dsonar.organization=pkr-test \
        -Dsonar.projectKey=pkr-test_Python-Sample-Application \
        -Dsonar.sources=. \
        -Dsonar.host.url=https://sonarcloud.io

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - BRANCH_NAME=$BRANCH_NAME
    - PROJECT_ID=$PROJECT_ID
    - APP_ENV=${_APP_ENV}
    - ARTIFACT_REGISTRY_REPOSITORY=${_ARTIFACT_REGISTRY_REPOSITORY}
    - COMMIT_SHA=$COMMIT_SHA
    - BUILD_ID=$BUILD_ID
availableSecrets:
  secretManager:
    - versionName: projects/244985839439/secrets/SONAR_TOKEN/versions/1
      env: "SONAR_TOKEN"
    - versionName: projects/244985839439/secrets/GITHUB_TOKEN/versions/1
      env: "GITHUB_TOKEN"
